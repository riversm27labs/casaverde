<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Casa Verde</title><style>[hidden]{display:none!important}*{box-sizing:border-box}body{background:#faf8f1;color:#203c29;font:16px system-ui;margin:0;display:grid;min-height:100vh;place-items:center}.card{width:min(440px,92vw);padding:35px;background:#fffef9;border:1px solid #d5dfcb;border-radius:24px}img{width:150px;display:block;margin:auto}h1{font-size:28px}p{line-height:1.7;color:#5b695c}label{display:grid;gap:8px;margin:18px 0}input,button{font:inherit;padding:14px;border-radius:9px;width:100%;border:1px solid #b9cab0}button{background:#326b36;color:white;cursor:pointer}a{color:#326b36}#status{white-space:pre-wrap}</style><main class="card"><img src="/brand/casa-verde.png" alt="Casa Verde"><h1 id="title">Entrar no painel</h1><p id="intro">Carregando configuração…</p><form id="form"><label id="email-label">E-mail<input type="email" id="email" autocomplete="username"></label><label>Senha<input type="password" id="password" required minlength="1" autocomplete="current-password"></label><button id="button">Entrar</button><p id="status" role="status"></p></form><a href="/">Voltar para a loja</a></main><script>let setup=false;const $=s=>document.querySelector(s);fetch('/api/auth/status').then(r=>r.json()).then(s=>{setup=!s.configured;$('#password').minLength=setup?10:1;$('#email-label').hidden=!s.remote;$('#email').required=s.remote;$('#intro').textContent=setup?'Primeiro acesso local: crie sua senha com pelo menos 10 caracteres. Ela será armazenada protegida neste computador.':s.remote?'Entre com o e-mail e senha cadastrados no Supabase.':'Digite a senha criada neste computador.';if(setup){$('#title').textContent='Configure seu acesso';$('#button').textContent='Criar senha e entrar';$('#password').autocomplete='new-password';}}).catch(()=>$('#intro').textContent='Não foi possível acessar o servidor.');$('#form').onsubmit=async e=>{e.preventDefault();$('#button').disabled=true;try{const r=await fetch('/api/auth/'+(setup?'setup':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);location.href='/admin';}catch(e){$('#status').textContent=e.message;}finally{$('#button').disabled=false;}};</script></html>
